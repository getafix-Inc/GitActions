name: List_Commits_Files_Lines

on: [push]

jobs:
  list-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: List commits, files, and line changes
        shell: bash
        run: |
          # 1. Get the list of commit SHAs in the push
          commits=$(echo '${{ toJSON(github.event.commits) }}' | jq -r '.[].id')
          
          echo "Processing commits in this push..."
          
          for sha in $commits; do
            echo "-----------------------------------"
            echo "Commit SHA: $sha"
            
            # 2. Get the list of files changed in this commit
            files=$(git diff-tree --no-commit-id --name-only -r "$sha")
            
            for file in $files; do
              echo "  File: $file"
              
              # 3. Extract line ranges (hunk headers) for each file
              # 'grep ^@@' filters only the lines showing the range (e.g., @@ -1,2 +1,3 @@)
              git show --unified=0 "$sha" -- "$file" | grep '^@@'
            done
          done
