name: CodeTrackerWF

on: [push]

jobs:
  list-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List all commit SHAs
        run: |
          # Lists all commit hashes in the current branch history
          # Newest first, oldest last
          git log --format="%H"
